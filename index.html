<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
        }
    </style>
</head>
<body>

<audio id="player"></audio>

<script>
    const songs = [
        "song1.mp3",
        "song2.mp3",
        "song3.mp3",
        "song4.mp3"
    ];

    const player = document.getElementById("player");
    let current = 0;

    function playSong(index) {
        player.src = songs[index];
        player.play().catch(() => {
            console.log("User interaction required.");
        });
    }

    player.addEventListener("ended", () => {
        current = (current + 1) % songs.length;
        playSong(current);
    });

    // Try autoplay
    playSong(current);

    // Start playback after first click if autoplay is blocked
    document.addEventListener("click", () => {
        if (player.paused) {
            player.play();
        }
    }, { once: true });
</script>

</body>
</html>
